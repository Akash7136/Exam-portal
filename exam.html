<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4353F5">
  <title>Assessment · CampusExam</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/exam.css">
  <script src="js/app.js" defer></script>
  <script src="js/exam.js" defer></script>
</head>
<body class="exam-page">
  <header class="exam-topbar">
    <a class="brand" href="student-dashboard.html"><span class="brand-mark">C</span><span>CampusExam</span></a>
    <div class="exam-top-center"><strong>Assessment</strong></div>
  </header>
  <main class="exam-empty-wrap">
    <section class="card exam-empty">
      <span class="result-check" data-icon="book"></span>
      <span class="eyebrow" id="exam-empty-eyebrow">ASSESSMENTS</span>
      <h1 id="exam-empty-title">No exam is available</h1>
      <p id="exam-empty-description">An exam will appear here after one has been created and published.</p>
      <p class="muted" id="exam-empty-details" hidden></p>
      <a class="btn btn-primary" href="student-dashboard.html">Return to dashboard</a>
    </section>
  </main>
</body>
</html>
