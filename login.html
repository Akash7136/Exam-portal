<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4353F5">
  <title>Sign in · CampusExam</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-form-side" aria-label="Sign in">
      <a class="brand" href="index.html" aria-label="CampusExam home">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9 12 4l9 5-9 5-9-5Z"/><path d="M7 11v5c3 2.5 7 2.5 10 0v-5M21 9v6"/></svg></span>
        <span>CampusExam</span>
      </a>
      <div class="login-content">
        <span class="eyebrow">Your campus, connected</span>
        <h1>Welcome Back</h1>
        <p>Sign in to continue to CampusExam.</p>
        <form class="login-form" id="login-form" novalidate>
          <div class="field">
            <label for="email">Email or college ID</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="you@college.edu" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-input">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
              <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password">◉</button>
            </div>
          </div>
          <a class="forgot-link" id="forgot-password" href="#">Forgot password?</a>
          <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
          <button class="btn btn-primary login-submit" id="login-button" type="submit">Login</button>
        </form>
      </div>
      <p class="login-footer">Secure access to your college examination portal.</p>
    </section>
    <section class="login-art" aria-label="CampusExam introduction">
      <div class="art-circle one"></div><div class="art-circle two"></div><div class="art-stars"></div>
      <svg class="student-art" viewBox="0 0 460 310" role="img" aria-label="Illustration of a student learning">
        <ellipse cx="226" cy="282" rx="176" ry="16" fill="#2736c2" opacity=".35"/>
        <rect x="74" y="64" width="177" height="134" rx="15" fill="#fff" opacity=".96"/>
        <rect x="88" y="78" width="149" height="103" rx="8" fill="#e8ebff"/>
        <path d="M110 155c19-28 37-5 52-24 14-18 25-4 49-30v80h-101z" fill="#c7ceff"/>
        <circle cx="208" cy="100" r="11" fill="#ffcc76"/>
        <path d="M132 198h60l12 12h-84z" fill="#fff" opacity=".9"/>
        <rect x="263" y="130" width="100" height="141" rx="11" fill="#fff"/>
        <rect x="274" y="144" width="78" height="109" rx="5" fill="#f0f2ff"/>
        <path d="M289 167h48M289 180h38M289 199h47M289 212h32" stroke="#a4adff" stroke-width="5" stroke-linecap="round"/>
        <path d="M224 130c-15 0-28 10-32 25l-13 46c-3 11 2 19 11 21l20-43-5 38 64 1 5-63c1-15-11-26-25-26h-25Z" fill="#ffcb85"/>
        <path d="M214 136c3-20 27-29 44-16l10 17-14 11-35-1z" fill="#202952"/>
        <path d="M197 222c-8 14-16 35-16 51h74l-7-55z" fill="#d8dcff"/>
        <path d="M181 268h39c6 0 10 5 10 10v4h-54c-5 0-7-7 5-14ZM242 268h25c10 0 18 5 19 14h-48z" fill="#fff"/>
        <circle cx="159" cy="43" r="19" fill="#fff" opacity=".16"/><path d="M335 64v24m-12-12h24" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".72"/>
        <path d="m66 230 8-15 8 15 15 8-15 8-8 15-8-15-15-8z" fill="#ffce75"/>
      </svg>
      <h2>Welcome to CampusExam</h2>
      <p>Your exams. Your progress. Your future.</p>
    </section>
  </main>
</body>
</html>
